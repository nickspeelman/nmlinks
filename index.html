<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe8">
  <title>Nick + Michele</title>
  <meta name="description" content="Links from Nick and Michele.">

  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4efe8;
      --card: rgba(255, 255, 255, 0.72);
      --text: #211f1c;
      --muted: #6f685f;
      --border: rgba(33, 31, 28, 0.12);
      --shadow: 0 18px 50px rgba(33, 31, 28, 0.08);
      --accent: #6d5143;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171513;
        --card: rgba(39, 35, 31, 0.78);
        --text: #f6f0e8;
        --muted: #b9afa4;
        --border: rgba(255, 255, 255, 0.10);
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
        --accent: #d7b39e;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(161, 126, 104, 0.10), transparent 32rem),
        radial-gradient(circle at bottom right, rgba(124, 111, 88, 0.08), transparent 28rem),
        var(--bg);
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 620px);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.6rem, 9vw, 5.2rem);
      font-weight: 500;
      line-height: 0.95;
      letter-spacing: -0.045em;
    }

    .intro {
      max-width: 38rem;
      margin: 18px 0 34px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .links {
      display: grid;
      gap: 14px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 92px;
      padding: 20px 22px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition:
        transform 160ms ease,
        border-color 160ms ease,
        box-shadow 160ms ease;
    }

    .link-card:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent) 35%, transparent);
      box-shadow: 0 22px 60px rgba(33, 31, 28, 0.12);
    }

    .link-card:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 65%, transparent);
      outline-offset: 4px;
    }

    .link-title {
      display: block;
      margin-bottom: 5px;
      font-size: 1.08rem;
      font-weight: 750;
    }

    .link-path {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .arrow {
      flex: 0 0 auto;
      color: var(--accent);
      font-size: 1.55rem;
      line-height: 1;
      transition: transform 160ms ease;
    }

    .link-card:hover .arrow {
      transform: translateX(3px);
    }

    footer {
      margin-top: 32px;
      color: var(--muted);
      font-size: 0.82rem;
    }
  </style>
</head>

<body>
  <main>
    <p class="eyebrow">nmlinks.us</p>
    <h1>Nick + Michele</h1>
    <p class="intro">
      A little home for things we make, share, and want to remember.
    </p>

    <section class="links" aria-label="Links">
      <a class="link-card" href="/pb">
        <span>
          <span class="link-title">PB Love</span>
          <span class="link-path">nmlinks.us/pb</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </section>

    <footer>
      Made by Nick + Michele
    </footer>
  </main>
</body>
</html>
